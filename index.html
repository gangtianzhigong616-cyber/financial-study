<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>財務諸表分析 完全対策フラッシュカード</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f5f7fb;color:#182235;margin:0}main{max-width:760px;margin:auto;padding:22px}h1{font-size:25px}header p{color:#526075}select,button,input{font:inherit;padding:11px;border:1px solid #cbd3df;border-radius:11px;background:white}button{cursor:pointer}button.primary{background:#1749b8;color:white;border-color:#1749b8}button:disabled{opacity:.4}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.panel{background:white;border:1px solid #dfe5ee;border-radius:20px;padding:26px;box-shadow:0 6px 22px #1c2c4b0c;min-height:220px}.meta{color:#66768c;font-size:14px}.question{font-size:23px;font-weight:700;line-height:1.65;margin:26px 0}.answer{font-size:19px;line-height:1.75;background:#f0f5ff;padding:17px;border-radius:12px;white-space:pre-wrap}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:17px}.stats{display:flex;gap:15px;flex-wrap:wrap;color:#526075;font-size:14px}.tag{background:#e7eefc;color:#1749b8;border-radius:30px;padding:5px 11px}.small{font-size:13px;color:#657184}.bar{height:8px;background:#e3e8f1;border-radius:8px;overflow:hidden;margin:13px 0}.fill{height:100%;background:#1749b8;transition:width .2s}#feedback{margin-top:12px;color:#1a5e3c}label{display:flex;gap:7px;align-items:center}footer{margin-top:22px;color:#6a7585;font-size:13px}</style></head><body><main><header><h1>財務諸表分析｜完全対策</h1><p>プリントの定義・公式・解釈・計算を繰り返し学ぶフラッシュカード</p></header><div class="stats"><span id="total"></span><span id="progress"></span><span id="score"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="toolbar"><select id="category" aria-label="分野"></select><select id="mode"><option value="all">すべての問題</option><option value="miss">苦手問題のみ</option><option value="new">未回答のみ</option></select><button id="shuffle">シャッフル</button><button id="reset">進捗リセット</button></div><section class="panel"><div class="meta"><span class="tag" id="cat"></span> <span id="page"></span> <span id="number"></span></div><div class="question" id="question"></div><div id="answer" class="answer" hidden></div><div class="actions"><button class="primary" id="reveal">答えを見る</button><button id="known" hidden>理解できた ✓</button><button id="miss" hidden>復習が必要 ↻</button><button id="prev">前へ</button><button id="next">次へ</button></div><div id="feedback"></div></section><footer>出典：財務諸表プリント（PDF全44ページ）。原本の講義内容・訂正版の数値例を照合し、応用・練習用の独自数値問題を追加。原本ページを表示しています。進捗はこの端末のブラウザ内に保存されます。</footer></main><script>const cards=[{"cat": "基礎", "page": 1, "q": "構成比率分析とは？", "a": "各項目÷合計×100。全体に占める各項目の割合を把握する。", "kind": "理解"}, {"cat": "基礎", "page": 1, "q": "百分率貸借対照表で100%とするものは？", "a": "総資産（資産合計）。各資産・負債・純資産項目の構成を比較する。", "kind": "理解"}, {"cat": "基礎", "page": 1, "q": "百分率損益計算書で100%とするものは？", "a": "売上高。費用・利益の売上高に対する割合を比較する。", "kind": "理解"}, {"cat": "基礎", "page": 2, "q": "趨勢比率分析とは？", "a": "比較年度金額÷基準年度金額×100。基準年度を100として時系列の増減をみる。", "kind": "理解"}, {"cat": "基礎", "page": 2, "q": "収益性分析は何を評価する？", "a": "投下した資本に対してどれだけの利益を生み出したか。利益率と資本効率の両面をみる。", "kind": "理解"}, {"cat": "基礎", "page": 3, "q": "資本利益率の基本式は？", "a": "利益÷資本×100。分子・分母の対応を意識する。", "kind": "理解"}, {"cat": "基礎", "page": 3, "q": "総資本の調達源泉による分類は？", "a": "自己資本と他人資本。総資本＝自己資本＋他人資本＝総資産。", "kind": "理解"}, {"cat": "基礎", "page": 3, "q": "資本の運用形態による分類は？", "a": "営業資産と金融資産など。資金を何に運用しているかで分類する。", "kind": "理解"}, {"cat": "基礎", "page": 5, "q": "利益と資本はそれぞれフローかストックか？", "a": "利益は期間のフロー、資本は時点のストック。分母は期首・期末平均を用いることが多い。", "kind": "理解"}, {"cat": "基礎", "page": 7, "q": "自己資本に対応する利益は？", "a": "親会社株主に帰属する当期純利益。非支配株主に帰属する利益を含めない。", "kind": "理解"}, {"cat": "基礎", "page": 7, "q": "自己資本は純資産と必ず一致する？", "a": "一致しない。自己資本は通常、株主資本＋その他の包括利益累計額で、非支配株主持分等を除く。", "kind": "理解"}, {"cat": "基礎", "page": 8, "q": "定性的分析で検討するものは？", "a": "事業環境、競争力、経営方針、会計数値の背景など。定量指標だけでは原因を確定できない。", "kind": "理解"}, {"cat": "収益性", "page": 4, "q": "総資本事業利益率（ROA）の式は？", "a": "事業利益÷平均総資本×100。事業利益は営業利益＋受取利息・配当金等。", "kind": "理解"}, {"cat": "収益性", "page": 4, "q": "ROEの式と意味は？", "a": "親会社株主に帰属する当期純利益÷平均自己資本×100。親会社株主の自己資本に対する収益力。", "kind": "理解"}, {"cat": "収益性", "page": 5, "q": "営業利益と経常利益が大きく異なる理由の一例は？", "a": "借入金が多く支払利息が大きいと、営業利益に比べ経常利益が低くなり得る。", "kind": "理解"}, {"cat": "収益性", "page": 9, "q": "ROAの2要因分解は？", "a": "売上高事業利益率×総資本回転率。利益幅と資本運用効率に分ける。", "kind": "理解"}, {"cat": "収益性", "page": 9, "q": "売上高事業利益率の式と意味は？", "a": "事業利益÷売上高×100。売上高当たりの事業利益の厚さ。", "kind": "理解"}, {"cat": "収益性", "page": 9, "q": "総資本回転率の式と意味は？", "a": "売上高÷平均総資本（回）。高いほど総資本から多くの売上を生む。", "kind": "理解"}, {"cat": "収益性", "page": 10, "q": "ROEの3要因分解（デュポン分析）は？", "a": "売上高当期純利益率×総資本回転率×財務レバレッジ。", "kind": "理解"}, {"cat": "収益性", "page": 10, "q": "財務レバレッジの式と意味は？", "a": "平均総資本÷平均自己資本（倍）。自己資本に対する総資本の倍率で負債利用度を表す。", "kind": "理解"}, {"cat": "収益性", "page": 11, "q": "ROEが上昇したとき確認すべき3要因は？", "a": "純利益率の改善、総資本回転率の改善、財務レバレッジの上昇のどれによるか。", "kind": "理解"}, {"cat": "収益性", "page": 13, "q": "薄利多売型企業の利益率・回転率の傾向は？", "a": "一般に売上高利益率は低く、資本回転率が高い傾向。業種特性として判断する。", "kind": "理解"}, {"cat": "収益性", "page": 13, "q": "高付加価値型企業の利益率・回転率の傾向は？", "a": "一般に利益率が高く、資本回転率が低い傾向。高い付加価値で利益を確保する。", "kind": "理解"}, {"cat": "収益性", "page": 13, "q": "利益率が低い企業は必ずROAも低い？", "a": "いいえ。回転率が高ければROAを確保できる。ROA＝利益率×回転率。", "kind": "理解"}, {"cat": "収益性", "page": 14, "q": "売上原価率の式と高い場合の解釈は？", "a": "売上原価÷売上高×100。高いほど原価負担が重く粗利益率が低くなりやすい。", "kind": "理解"}, {"cat": "収益性", "page": 14, "q": "売上高販管費率の式と高い場合の解釈は？", "a": "販管費÷売上高×100。高いほど販売・管理コストの負担が重い。広告宣伝など戦略投資の可能性もある。", "kind": "理解"}, {"cat": "収益性", "page": 14, "q": "営業利益と売上高・費用の関係は？", "a": "営業利益＝売上高－売上原価－販売費及び一般管理費。", "kind": "理解"}, {"cat": "収益性", "page": 14, "q": "営業利益率を費用率から表すと？", "a": "営業利益率＝100%－売上原価率－売上高販管費率。", "kind": "理解"}, {"cat": "収益性", "page": 15, "q": "ROEとROAは単純に同じ利益を使う？", "a": "いいえ。ROAは事業利益、ROEは親会社株主帰属純利益。税金・利息等の調整が必要。", "kind": "理解"}, {"cat": "収益性", "page": 16, "q": "負債利用とROEの関係を示す式は？", "a": "ROE＝[ROA＋(他人資本÷自己資本)×(ROA－負債利子率)]×(1－税率)。資料の簡略化前提。", "kind": "理解"}, {"cat": "収益性", "page": 16, "q": "ROAが負債利子率を上回ると負債増加はROEにどう作用？", "a": "その他の条件が一定ならROEを押し上げる。正のレバレッジ効果。", "kind": "理解"}, {"cat": "収益性", "page": 16, "q": "ROAが負債利子率を下回ると負債増加はROEにどう作用？", "a": "その他の条件が一定ならROEを押し下げる。負のレバレッジ効果。", "kind": "理解"}, {"cat": "収益性", "page": 16, "q": "財務レバレッジが高ければ必ず望ましい？", "a": "いいえ。負債利子率とROAの関係、返済負担、財務安全性も考慮する。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 18, "q": "営業循環の順序は？", "a": "仕入→生産→販売→売上債権回収。資金が事業を循環する。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 19, "q": "資本回転率の基本式は？", "a": "売上高÷平均投下資本。資本が何回売上に結びついたかを示す。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 19, "q": "回転率から回転期間（日）を求める式は？", "a": "365÷回転率。回転率が高いほど回転期間は短い。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 19, "q": "有形固定資産回転率の式は？", "a": "売上高÷平均有形固定資産。有形固定資産の売上創出効率を表す。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 20, "q": "売上債権回転率の式は？", "a": "売上高÷平均売上債権。高いほど売掛金などの回収が速い傾向。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 20, "q": "売上債権回転期間の式は？", "a": "平均売上債権÷売上高×365。販売代金回収までの平均日数の目安。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 21, "q": "売上債権回転期間が長いと何が懸念される？", "a": "回収の遅れや資金拘束。業種・信用販売条件の違いも考慮する。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 23, "q": "棚卸資産には何が含まれる？", "a": "商品・製品、仕掛品、原材料・貯蔵品など。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 23, "q": "棚卸資産回転率の式は？", "a": "売上高÷平均棚卸資産。授業資料では売上原価ではなく売上高を使用。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 23, "q": "棚卸資産回転期間の式は？", "a": "平均棚卸資産÷売上高×365。仕入から販売までの期間の目安。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 23, "q": "棚卸資産回転期間が長い場合に考えられることは？", "a": "過剰在庫、販売不振、在庫劣化や保管コスト増。ただし業種特性も考慮。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 23, "q": "棚卸資産回転率が極端に高い場合の注意点は？", "a": "在庫不足や欠品リスク。高ければ無条件に良いとはいえない。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 25, "q": "仕入債務回転率の式は？", "a": "売上高÷平均仕入債務。授業資料の定義。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 25, "q": "仕入債務回転期間の式は？", "a": "平均仕入債務÷売上高×365。仕入代金支払いまでの日数の目安。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 25, "q": "仕入債務回転期間が長いことの利点とリスクは？", "a": "支払まで資金を保持できる一方、支払遅延・信用悪化の可能性もある。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 26, "q": "CCCの式は？", "a": "棚卸資産回転期間＋売上債権回転期間－仕入債務回転期間。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 26, "q": "CCCが短いと何を意味する？", "a": "支払から回収までの資金拘束期間が短い。運転資金効率が高い傾向。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 37, "q": "CCCを短縮する具体策を3つ挙げよ", "a": "在庫削減、売上債権の早期回収、仕入債務の支払期間延長（信用維持に配慮）。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 37, "q": "CCCが悪化する典型的な3要因は？", "a": "在庫滞留、売掛金回収長期化、仕入代金支払期間の短縮。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 26, "q": "CCCがマイナスなら必ず経営状態が悪い？", "a": "いいえ。代金回収が仕入代金支払いより早い事業モデルではマイナスもあり得る。", "kind": "理解"}, {"cat": "安全性", "page": 27, "q": "短期安全性の代表的指標は？", "a": "流動比率と当座比率。短期債務への支払余力を評価。", "kind": "理解"}, {"cat": "安全性", "page": 27, "q": "流動比率の式と解釈は？", "a": "流動資産÷流動負債×100。高いほど短期支払余力がある傾向。資産の換金性に注意。", "kind": "理解"}, {"cat": "安全性", "page": 28, "q": "当座比率の式と解釈は？", "a": "当座資産÷流動負債×100。棚卸資産等を除いた流動性の高い資産による短期支払余力。", "kind": "理解"}, {"cat": "安全性", "page": 28, "q": "当座資産の代表例は？", "a": "現金預金、売上債権、短期有価証券など。", "kind": "理解"}, {"cat": "安全性", "page": 28, "q": "手元流動性比率の式と単位は？", "a": "(現金預金＋短期有価証券)÷月商。単位は月。何か月分の売上に相当する手元資金かを示す。", "kind": "理解"}, {"cat": "安全性", "page": 29, "q": "自己資本比率の式と意味は？", "a": "自己資本÷総資産×100。高いほど負債依存度が低く財務安全性が高い傾向。", "kind": "理解"}, {"cat": "安全性", "page": 31, "q": "固定比率の式は？", "a": "固定資産÷自己資本×100。固定資産を自己資本で賄えているか。", "kind": "理解"}, {"cat": "安全性", "page": 31, "q": "固定長期適合率の式は？", "a": "固定資産÷(自己資本＋固定負債)×100。固定資産を長期資金で賄えているか。", "kind": "理解"}, {"cat": "安全性", "page": 32, "q": "固定比率が100%未満とは？", "a": "固定資産を自己資本の範囲内で賄えている。", "kind": "理解"}, {"cat": "安全性", "page": 32, "q": "固定長期適合率が100%未満とは？", "a": "固定資産を自己資本と固定負債の合計で賄えている。", "kind": "理解"}, {"cat": "安全性", "page": 33, "q": "インタレスト・カバレッジ・レシオの式は？", "a": "(営業利益＋受取利息・配当金等)÷支払利息。利息支払能力の倍率。", "kind": "理解"}, {"cat": "安全性", "page": 34, "q": "インタレスト・カバレッジ・レシオが低いと？", "a": "利息支払余力が乏しい可能性。利益の一時性や支払利息の小ささにも注意。", "kind": "理解"}, {"cat": "安全性", "page": 27, "q": "安全性指標は高いほど常に良い？", "a": "必ずしもそうではない。余剰資金・資本効率低下や業種特性を併せてみる。", "kind": "理解"}, {"cat": "成長性", "page": 39, "q": "売上高成長率の式は？", "a": "(当期売上高－前期売上高)÷前期売上高×100。", "kind": "理解"}, {"cat": "成長性", "page": 39, "q": "CAGR（年平均成長率）の式は？", "a": "(最終年度売上高÷初年度売上高)^(1/年数)－1。百分率表示は×100。", "kind": "理解"}, {"cat": "成長性", "page": 40, "q": "総資産成長率の式は？", "a": "(当期総資産－前期総資産)÷前期総資産×100。", "kind": "理解"}, {"cat": "成長性", "page": 40, "q": "サステナブル成長率の簡便式は？", "a": "ROE×(1－配当性向)。利益留保による持続可能な成長の目安。", "kind": "理解"}, {"cat": "成長性", "page": 41, "q": "売上高研究開発費率の式は？", "a": "研究開発費÷売上高×100。研究開発への投入度合いをみる。", "kind": "理解"}, {"cat": "成長性", "page": 41, "q": "売上高設備投資比率の式は？", "a": "設備投資額÷売上高×100。設備への投資強度をみる。", "kind": "理解"}, {"cat": "成長性", "page": 42, "q": "予想売上高成長率の式は？", "a": "(予想売上高－前期実績売上高)÷前期実績売上高×100。", "kind": "理解"}, {"cat": "成長性", "page": 43, "q": "配当性向の式は？", "a": "1株当たり配当金÷1株当たり当期純利益×100。または配当総額÷当期純利益×100。", "kind": "理解"}, {"cat": "成長性", "page": 43, "q": "配当性向が高いと内部留保と成長余力はどうなる？", "a": "他条件一定なら内部留保率が低下し、簡便式のサステナブル成長率は低くなる。", "kind": "理解"}, {"cat": "成長性", "page": 41, "q": "研究開発費率が高ければ必ず将来成長率も高い？", "a": "いいえ。投資強度は分かるが、成果や効率・将来の収益化は別に評価する。", "kind": "理解"}, {"cat": "応用", "page": 35, "q": "ROEの変化を3要因で表す式は？", "a": "ΔROE＝PM₂×ATO₂×LEV₂－PM₁×ATO₁×LEV₁。PMは純利益率、ATOは総資本回転率、LEVは財務レバレッジ。", "kind": "理解"}, {"cat": "応用", "page": 36, "q": "ROE変化の利益率単独効果は？", "a": "(PM₂－PM₁)×ATO₁×LEV₁。ほかの2要因を基準期に固定。", "kind": "理解"}, {"cat": "応用", "page": 36, "q": "ROE変化の総資本回転率単独効果は？", "a": "PM₁×(ATO₂－ATO₁)×LEV₁。", "kind": "理解"}, {"cat": "応用", "page": 36, "q": "ROE変化のレバレッジ単独効果は？", "a": "PM₁×ATO₁×(LEV₂－LEV₁)。", "kind": "理解"}, {"cat": "応用", "page": 36, "q": "ROE変化は3つの単独効果の合計に必ず一致する？", "a": "一致しない場合がある。2要因・3要因の交互作用を加える必要がある。", "kind": "理解"}, {"cat": "応用", "page": 44, "q": "将来予測値の空欄はプリントの数値だけで必ず計算できる？", "a": "いいえ。会社公表の予想値など外部の前提が必要な場合がある。", "kind": "理解"}, {"cat": "計算", "page": 4, "q": "事業利益50、平均総資本1,000。ROAは？", "a": "5%。50÷1,000×100。", "kind": "計算"}, {"cat": "計算", "page": 9, "q": "事業利益40、売上高800、平均総資本400。ROAは？", "a": "10%。利益率5%×回転率2回。", "kind": "計算"}, {"cat": "計算", "page": 10, "q": "純利益30、売上高600、平均総資本300、平均自己資本150。ROEは？", "a": "20%。5%×2回×2倍。", "kind": "計算"}, {"cat": "計算", "page": 14, "q": "売上高1,000、原価600、販管費250。営業利益率は？", "a": "15%。(1,000－600－250)÷1,000×100。", "kind": "計算"}, {"cat": "計算", "page": 14, "q": "売上原価率62%、販管費率33%。営業利益率は？", "a": "5%。100－62－33。", "kind": "計算"}, {"cat": "計算", "page": 16, "q": "ROA8%、負債利子率4%、他人資本300、自己資本200、税率30%。ROEは？", "a": "9.8%。[8＋1.5×(8－4)]×0.7。", "kind": "計算"}, {"cat": "計算", "page": 17, "q": "ROA3%、負債利子率5%、他人資本400、自己資本400、税率40%。ROEは？", "a": "0.6%。[3＋1×(3－5)]×0.6。", "kind": "計算"}, {"cat": "計算", "page": 19, "q": "売上高1,200、平均総資本600。総資本回転率は？", "a": "2回。1,200÷600。", "kind": "計算"}, {"cat": "計算", "page": 20, "q": "売上高730、期首売上債権80、期末120。回転期間は？", "a": "50日。平均債権100÷730×365。", "kind": "計算"}, {"cat": "計算", "page": 23, "q": "売上高365、期首在庫20、期末在庫40。棚卸資産回転期間は？", "a": "30日。平均在庫30÷365×365。", "kind": "計算"}, {"cat": "計算", "page": 24, "q": "G社の棚卸資産：期首27,504、期末31,111、売上350,270。回転期間は？", "a": "約30.5日。平均棚卸資産29,307.5÷350,270×365。", "kind": "計算"}, {"cat": "計算", "page": 24, "q": "M社の棚卸資産：期首15,538、期末17,182、売上205,368。回転期間は？", "a": "約29.1日。平均棚卸資産16,360÷205,368×365。", "kind": "計算"}, {"cat": "計算", "page": 25, "q": "売上高730、期首仕入債務40、期末60。仕入債務回転期間は？", "a": "25日。平均債務50÷730×365。", "kind": "計算"}, {"cat": "計算", "page": 26, "q": "棚卸30日、売上債権40日、仕入債務50日。CCCは？", "a": "20日。30＋40－50。", "kind": "計算"}, {"cat": "計算", "page": 26, "q": "棚卸45日、売上債権35日、仕入債務60日。CCCは？", "a": "20日。45＋35－60。", "kind": "計算"}, {"cat": "計算", "page": 27, "q": "流動資産500、流動負債250。流動比率は？", "a": "200%。500÷250×100。", "kind": "計算"}, {"cat": "計算", "page": 28, "q": "当座資産240、流動負債200。当座比率は？", "a": "120%。240÷200×100。", "kind": "計算"}, {"cat": "計算", "page": 28, "q": "現金預金90、短期有価証券30、年商720。手元流動性比率は？", "a": "2か月。月商60、(90＋30)÷60。", "kind": "計算"}, {"cat": "計算", "page": 29, "q": "自己資本400、総資産1,000。自己資本比率は？", "a": "40%。400÷1,000×100。", "kind": "計算"}, {"cat": "計算", "page": 30, "q": "G社の自己資本213,892、総資産348,452。自己資本比率は？", "a": "約61.38%。213,892÷348,452×100。", "kind": "計算"}, {"cat": "計算", "page": 30, "q": "M社の自己資本96,438、総資産175,837。自己資本比率は？", "a": "約54.85%。96,438÷175,837×100。", "kind": "計算"}, {"cat": "計算", "page": 31, "q": "固定資産600、自己資本500。固定比率は？", "a": "120%。600÷500×100。", "kind": "計算"}, {"cat": "計算", "page": 31, "q": "固定資産600、自己資本400、固定負債400。固定長期適合率は？", "a": "75%。600÷800×100。", "kind": "計算"}, {"cat": "計算", "page": 33, "q": "事業利益120、支払利息20。ICRは？", "a": "6倍。120÷20。", "kind": "計算"}, {"cat": "計算", "page": 33, "q": "G社の利息支払能力：(16,746＋545＋729)÷33 は？", "a": "約546.1倍。18,020÷33。", "kind": "計算"}, {"cat": "計算", "page": 39, "q": "前期売上800、当期売上920。成長率は？", "a": "15%。120÷800×100。", "kind": "計算"}, {"cat": "計算", "page": 40, "q": "G社の売上高：353,432→350,270。成長率は？", "a": "約－0.89%。(350,270－353,432)÷353,432×100。", "kind": "計算"}, {"cat": "計算", "page": 40, "q": "M社の売上高：205,022→205,368。成長率は？", "a": "約0.17%。346÷205,022×100。", "kind": "計算"}, {"cat": "計算", "page": 39, "q": "売上高が4年間で100→146.41。CAGRは？", "a": "10%。(146.41÷100)^(1/4)－1。", "kind": "計算"}, {"cat": "計算", "page": 40, "q": "ROE12%、配当性向25%。簡便式のサステナブル成長率は？", "a": "9%。12%×(1－0.25)。", "kind": "計算"}, {"cat": "計算", "page": 41, "q": "研究開発費1,200、売上高120,000。研究開発費率は？", "a": "1%。1,200÷120,000×100。", "kind": "計算"}, {"cat": "計算", "page": 42, "q": "B社研究開発費1,242、売上117,572。研究開発費率は？", "a": "約1.06%。1,242÷117,572×100。", "kind": "計算"}, {"cat": "計算", "page": 43, "q": "1株配当40円、EPS200円。配当性向は？", "a": "20%。40÷200×100。", "kind": "計算"}, {"cat": "計算", "page": 35, "q": "前期PM5%、ATO2回、LEV2倍。ROEは？", "a": "20%。0.05×2×2。", "kind": "計算"}, {"cat": "計算", "page": 36, "q": "PMが5%→6%、前期ATO2回、前期LEV2倍。PM単独効果は？", "a": "＋4ポイント。(0.06－0.05)×2×2＝0.04。", "kind": "計算"}, {"cat": "基礎", "page": 1, "q": "実数分析と比率分析の違いは？", "a": "実数分析は金額そのものの規模・変化を確認する。比率分析は基準額に対する相対的な大きさを比較する。", "kind": "理解"}, {"cat": "基礎", "page": 2, "q": "趨勢比率で基準年度が100、比較年度が85なら何を意味する？", "a": "基準年度より15%減少している。85%の減少ではない。", "kind": "理解"}, {"cat": "基礎", "page": 3, "q": "総資本を調達源泉からみたとき、負債と自己資本の違いは？", "a": "負債は返済義務のある他人資本、自己資本は株主に帰属する資本。", "kind": "理解"}, {"cat": "収益性", "page": 4, "q": "事業利益の計算で受取利息・配当金を加えるのはなぜ？", "a": "総資本は営業資産だけでなく金融資産にも運用され、その運用成果も含めて収益性を評価するため。", "kind": "理解"}, {"cat": "収益性", "page": 5, "q": "期末総資本だけで利益率を計算すると何が問題？", "a": "期間中に資本が増減した場合、期間利益と期末時点の資本との対応が悪くなる。期首期末平均を使う。", "kind": "理解"}, {"cat": "収益性", "page": 7, "q": "自己資本利益率で非支配株主持分を除くのはなぜ？", "a": "親会社株主に帰属する利益を、対応する親会社株主の自己資本と比較するため。", "kind": "理解"}, {"cat": "収益性", "page": 8, "q": "ROE比較に加えて定性的分析が必要な理由は？", "a": "利益率の変動には事業環境、商品構成、競争状況など数値以外の背景があるため。", "kind": "理解"}, {"cat": "収益性", "page": 9, "q": "ROAの2要因分解から利益率低下を補える条件は？", "a": "総資本回転率が十分に上昇すれば、利益率低下を補ってROAを維持・改善できる。", "kind": "理解"}, {"cat": "収益性", "page": 10, "q": "ROEの3要因分解における売上高当期純利益率の分子は？", "a": "親会社株主に帰属する当期純利益。", "kind": "理解"}, {"cat": "収益性", "page": 11, "q": "財務レバレッジの上昇でROEが改善しても慎重に評価する理由は？", "a": "負債依存度上昇による財務リスクの増加があり、事業そのものの収益性改善とは限らないため。", "kind": "理解"}, {"cat": "収益性", "page": 13, "q": "業種間でROAを比較するときに確認すべきことは？", "a": "利益率と回転率の組み合わせが業種によって異なること。薄利多売型と高利益率・低回転型を区別する。", "kind": "理解"}, {"cat": "収益性", "page": 14, "q": "売上高原価率と売上高販管費率が同時に上昇したら営業利益率は？", "a": "ほかの条件が一定なら低下する。営業利益率＝100%－原価率－販管費率。", "kind": "理解"}, {"cat": "収益性", "page": 15, "q": "ROEをROAと結びつける際に必要な調整は？", "a": "他人資本の利息負担と税金の影響を考慮する。事業利益と純利益は一致しない。", "kind": "理解"}, {"cat": "収益性", "page": 16, "q": "ROAと負債利子率が等しい場合、負債比率を増やす効果は？", "a": "簡略式では負債利用によるROEの押し上げ・押し下げ効果はゼロ。", "kind": "理解"}, {"cat": "収益性", "page": 17, "q": "【原本訂正例】ROA10%、負債利子率5%、他人資本400、自己資本100、税率40%。ROEは？", "a": "18%。[10＋(400÷100)×(10－5)]×0.6＝18%。原本p.17の訂正版。", "kind": "理解"}, {"cat": "収益性", "page": 17, "q": "【原本訂正例】ROA3%、負債利子率5%、他人資本400、自己資本100、税率40%。ROEは？", "a": "－3%。[3＋4×(3－5)]×0.6＝－3%。原本p.17の訂正版。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 18, "q": "営業循環で「売上」と「現金回収」が異なる理由は？", "a": "掛売りの場合、商品販売後に売上債権が生じ、現金回収まで時間差があるため。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 19, "q": "有形固定資産回転率が高くなる2つの要因は？", "a": "売上高の増加、または有形固定資産の減少（売却・償却など）。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 20, "q": "売上債権回転率が低下したとき、回転期間はどう変わる？", "a": "長くなる。365÷回転率であるため。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 21, "q": "売上債権回転期間が短縮した場合の資金面の効果は？", "a": "販売代金の回収が早まり、売上債権に拘束される運転資金が減る。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 23, "q": "棚卸資産回転率が低下する典型的な原因は？", "a": "販売に比べて在庫が増加すること。売上減少や過剰在庫などが考えられる。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 24, "q": "原本のG社・M社の棚卸資産回転期間はどちらが長い？", "a": "G社が約30.5日、M社が約29.1日。G社の方が約1.4日長い。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 25, "q": "仕入債務回転期間が短くなると資金繰りはどうなる？", "a": "仕入代金を早く支払うため、ほかの条件が一定なら資金繰りへの負担が増える。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 26, "q": "CCCの3要素のうち、引き算するのはどれ？", "a": "仕入債務回転期間。仕入代金の支払いを先延ばしにできる期間だから。", "kind": "理解"}, {"cat": "回転率・CCC", "page": 26, "q": "CCCが10日から30日に増えた場合の意味は？", "a": "現金が事業に拘束される期間が20日長期化した。ほかの条件が一定なら運転資金負担が増える。", "kind": "理解"}, {"cat": "安全性", "page": 27, "q": "財務安全性分析の「短期」と「長期」の主な違いは？", "a": "短期は流動負債への支払能力、長期は資本調達構造や固定資産と長期資金の対応を評価する。", "kind": "理解"}, {"cat": "安全性", "page": 28, "q": "流動比率が高くても当座比率が低い企業は何に注意？", "a": "流動資産に棚卸資産など換金性の低い資産が多い可能性。", "kind": "理解"}, {"cat": "安全性", "page": 29, "q": "自己資本比率が高い企業の負債利用は一般にどうか？", "a": "総資産に対する自己資本の割合が高く、負債への依存度が相対的に低い。", "kind": "理解"}, {"cat": "安全性", "page": 30, "q": "原本の自己資本比率はG社とM社のどちらが高い？", "a": "G社約61.38%、M社約54.85%。G社が約6.53ポイント高い。", "kind": "理解"}, {"cat": "安全性", "page": 31, "q": "固定比率と固定長期適合率で分母が違う理由は？", "a": "固定比率は自己資本のみ、固定長期適合率は自己資本＋固定負債という長期資金で固定資産を賄えているかをみるため。", "kind": "理解"}, {"cat": "安全性", "page": 32, "q": "固定比率120%、固定長期適合率80%の企業はどう評価する？", "a": "固定資産は自己資本だけでは賄えないが、固定負債を含む長期資金の範囲内で賄えている。", "kind": "理解"}, {"cat": "安全性", "page": 33, "q": "ICRが非常に高い場合に分母について確認することは？", "a": "支払利息が非常に小さいために倍率が大きくなっていないか。", "kind": "理解"}, {"cat": "安全性", "page": 34, "q": "負債比率分析だけでは将来の支払能力を十分評価できない理由は？", "a": "貸借対照表は一時点の残高であり、将来の利益やキャッシュ・フローを直接示さないため。", "kind": "理解"}, {"cat": "応用", "page": 35, "q": "ROEが低下したとき、3要因分解で切り分けるべきことは？", "a": "売上高利益率・総資本回転率・財務レバレッジのどれが低下に寄与したか。", "kind": "理解"}, {"cat": "応用", "page": 36, "q": "ROE変動のPM×ATO交互作用は？", "a": "(PM₂－PM₁)×(ATO₂－ATO₁)×LEV₁。", "kind": "理解"}, {"cat": "応用", "page": 36, "q": "ROE変動のPM×LEV交互作用は？", "a": "(PM₂－PM₁)×ATO₁×(LEV₂－LEV₁)。", "kind": "理解"}, {"cat": "応用", "page": 36, "q": "ROE変動のATO×LEV交互作用は？", "a": "PM₁×(ATO₂－ATO₁)×(LEV₂－LEV₁)。", "kind": "理解"}, {"cat": "応用", "page": 36, "q": "ROE変動の3要因交互作用は？", "a": "(PM₂－PM₁)×(ATO₂－ATO₁)×(LEV₂－LEV₁)。", "kind": "理解"}, {"cat": "応用", "page": 37, "q": "CCCの改善がROAに好影響を与え得る理由は？", "a": "売上債権や棚卸資産に拘束される資本が減り、総資本回転率の改善につながり得るため。", "kind": "理解"}, {"cat": "応用", "page": 38, "q": "売上高利益率が改善してもROEが低下し得る理由は？", "a": "総資本回転率や財務レバレッジの低下が利益率改善を上回る場合がある。", "kind": "理解"}, {"cat": "成長性", "page": 39, "q": "売上高のCAGRが単年度成長率と異なるのはなぜ？", "a": "初年度から最終年度までの複利換算の平均成長率で、途中の年ごとの変動を直接表さないため。", "kind": "理解"}, {"cat": "成長性", "page": 39, "q": "売上高成長率が高くても利益が増えない場合の原因は？", "a": "売上原価や販管費が売上以上に増加した可能性がある。", "kind": "理解"}, {"cat": "成長性", "page": 40, "q": "サステナブル成長率が高まる2つの条件は？", "a": "ROEの上昇、または配当性向の低下（利益留保率の上昇）。簡便式の前提。", "kind": "理解"}, {"cat": "成長性", "page": 41, "q": "研究開発費と設備投資額を売上高で割る目的は？", "a": "企業規模の違いをならして、売上に対する研究開発・設備投資の強度を比較するため。", "kind": "理解"}, {"cat": "成長性", "page": 42, "q": "予想成長率の計算で「予想売上高」と比較するのは？", "a": "前期の実績売上高。予想値と実績値の対象年度を混同しない。", "kind": "理解"}, {"cat": "成長性", "page": 43, "q": "決算短信の業績予想を見るとき注意すべきことは？", "a": "予想は会社の見通しであり、実績ではない。予想時点と対象年度を確認する。", "kind": "理解"}, {"cat": "計算", "page": 17, "q": "【原本訂正例】ROA10%、負債利子率5%、負債100、自己資本400、税率40%。ROEは？", "a": "6.75%。[10＋(100÷400)×5]×0.6。", "kind": "計算"}, {"cat": "計算", "page": 17, "q": "【原本訂正例】ROA3%、負債利子率5%、負債100、自己資本400、税率40%。ROEは？", "a": "1.5%。[3＋0.25×(－2)]×0.6。", "kind": "計算"}, {"cat": "計算", "page": 36, "q": "PM5%→6%、ATO2→3回、LEV2→2.5倍。PM×ATO交互作用は？", "a": "＋2.0ポイント。(0.06－0.05)×(3－2)×2＝0.02。", "kind": "計算"}, {"cat": "計算", "page": 36, "q": "PM5%→6%、ATO2→3回、LEV2→2.5倍。3要因交互作用は？", "a": "＋0.5ポイント。(0.06－0.05)×(3－2)×(2.5－2)＝0.005。", "kind": "計算"}, {"cat": "計算", "page": 26, "q": "売上債権40日、棚卸資産30日、仕入債務35日。CCCは？", "a": "35日。40＋30－35。", "kind": "計算"}, {"cat": "計算", "page": 32, "q": "固定資産900、自己資本600、固定負債500。固定比率と固定長期適合率は？", "a": "固定比率150%、固定長期適合率約81.8%。900÷600、900÷1,100。", "kind": "計算"}, {"cat": "計算", "page": 39, "q": "売上高が3年間で200→266.2。CAGRは？", "a": "約10%。(266.2÷200)^(1/3)－1。", "kind": "計算"}, {"cat": "計算", "page": 41, "q": "売上高2,000、研究開発費60、設備投資額100。2つの売上高比率は？", "a": "研究開発費率3%、設備投資比率5%。", "kind": "計算"}];const key='financial-flash-v1';let reviews={};try{reviews=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let order=[],pos=0;const $=id=>document.getElementById(id);const cats=['全分野',...new Set(cards.map(c=>c.cat))];$('category').innerHTML=cats.map(c=>`<option>${c}</option>`).join('');function filtered(){let cat=$('category').value,mode=$('mode').value;return cards.map((c,i)=>({...c,i})).filter(c=>(cat==='全分野'||c.cat===cat)&&(mode==='all'||(mode==='miss'&&reviews[c.i]==='miss')||(mode==='new'&&!reviews[c.i])))}function rebuild(){order=filtered();pos=0;render()}function render(){let done=Object.values(reviews).filter(x=>x==='known').length;let attempts=Object.keys(reviews).length;$('total').textContent=`全${cards.length}問`;$('progress').textContent=`判定済み ${attempts}問`;$('score').textContent=`理解できた ${done}問`;$('fill').style.width=(attempts/cards.length*100)+'%';let c=order[pos];$('number').textContent=order.length?`${pos+1} / ${order.length}`:'';$('cat').textContent=c?c.cat:'完了';$('page').textContent=c?`原本p.${c.page}`:'';$('question').textContent=c?c.q:'この条件に合う問題はありません。分野・表示条件を変更してください。';$('answer').textContent=c?c.a:'';$('answer').hidden=true;$('reveal').hidden=!c;$('known').hidden=true;$('miss').hidden=true;$('prev').disabled=pos===0;$('next').disabled=pos>=order.length-1;$('feedback').textContent=''}$('reveal').onclick=()=>{$('answer').hidden=false;$('reveal').hidden=true;$('known').hidden=false;$('miss').hidden=false};function grade(v){let c=order[pos];if(!c)return;reviews[c.i]=v;try{localStorage.setItem(key,JSON.stringify(reviews))}catch(e){}$('feedback').textContent=v==='known'?'理解済みに記録しました':'苦手問題に登録しました';if(pos<order.length-1){pos++;render()}else{render();$('answer').hidden=false;$('reveal').hidden=true;$('feedback').textContent='このセットの最後です。苦手問題モードで復習できます。'}}$('known').onclick=()=>grade('known');$('miss').onclick=()=>grade('miss');$('prev').onclick=()=>{if(pos>0){pos--;render()}};$('next').onclick=()=>{if(pos<order.length-1){pos++;render()}};$('category').onchange=rebuild;$('mode').onchange=rebuild;$('shuffle').onclick=()=>{order=filtered().sort(()=>Math.random()-.5);pos=0;render()};$('reset').onclick=()=>{if(confirm('学習記録をすべてリセットしますか？')){reviews={};localStorage.removeItem(key);rebuild()}};rebuild();</script></body></html>
